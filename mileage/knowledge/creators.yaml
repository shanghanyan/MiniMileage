# Creator intake list for the aggregator's DISCOVERY mode (§6.1).
#
# This is part of the aggregator (Engine A), NOT a separate engine. Two public,
# opt-in source types per creator — blog RSS feeds and YouTube channels — both
# flow through the SAME local extractor -> RawChartRow[] -> _build_charts ->
# AwardQuote[] pipeline as everything else. No WAF, no credentialed scraping.
#
# Discovery flow:
#   blogs : poll blog_rss -> Fetcher.get(post_url) -> readability body -> extractor
#   video : poll youtube feed -> youtube-transcript-api(video_id) -> transcript -> extractor
#   email : the occulosequor@gmail.com inbox (newsletters) is the third intake,
#           handled separately; Daily Drop's primary intake is email, not RSS.
#
# Provenance tags: "blog:{name}" / "yt:{name}" / "email:{sender}". All carry the
# llm_extracted flag and can only ever produce `tentative_best`, never `best`,
# until an INDEPENDENT source confirms (cross-check vs knowledge/charts.yaml).
#
# VERIFY BEFORE TRUSTING (no-hallucination contract):
#   * Blog feeds below use the standard WordPress `/feed/` convention — confirm
#     each with `mileage sources --validate-urls --force` before relying on it.
#   * YouTube RSS feed URL = https://www.youtube.com/feeds/videos.xml?channel_id=<UC...>
#   * channel_id values that are filled in were read from canonical youtube.com/channel/<id>
#     URLs (verifiable). Any channel_id marked TODO must be resolved ONCE by loading
#     youtube.com/<handle> and reading the canonical id — DO NOT guess a UC string.

creators:

  # ── blog-first creators (RSS + some video) ────────────────────────────────

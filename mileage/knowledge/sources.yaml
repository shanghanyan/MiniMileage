# Aggregator (Engine A) target list — ordered, trust-weighted (§6).
#
# PHASE 1+: real public URLs for L4 chart data. Sources are sorted by the
# loader (highest trust first) but explicit ordering here states intent.
#
# BRAIN BOUNDARY: WAF-protected first-party sites (Turkish official,
# LifeMiles official, ANA official, KrisFlyer official) belong to Engine B.
# Do NOT add those here. See §8 quarantine constraints in Cursor-Mileage-Plan.md.
#
# Target schema:
#   name       unique source id (becomes provenance source_name)
#   url        file:// (relative to this dir) or http(s)://
#   format     html_table | html_table_wide | html_table_destination |
#              html_table_zone_matrix | html_table_seasonal_zones | json | rss | pdf
#   program    loyalty program this source covers (required for html_table_wide + pdf + destination)
#   hub        program origin airport, IATA (required for html_table_destination)
#   provides   chart  (L4 — no live seat -> no_live_space flag)
#              award  (L3 — live seat -> seats_available set)
#   role       primary  (the source we DEPEND ON for this program)
#              fallback (a redundant backup: mirror, unparseable PDF, blog echo)
#              -> the live-scrape scoreboard hard-fails only when a PRIMARY
#                 breaks; a fallback failure is a WARN (a working primary covers
#                 it). Defaults to primary when omitted.
#   trust      [0,1] weight for rotation order + cross-check median
#   updated_at ISO date the source data was last verified current
#   layers     informational tags

targets:

  # ── L4 CHARTS — live public URLs ───────────────────────────────────────────

  # Aeroplan official Air Canada PDF (distance-based, June 2026).
  # Requires pdfplumber for binary PDF extraction; gracefully returns []
  # without it. Tagged role:fallback — atf-aeroplan-chart (HTML) is the working
  # primary; this high-trust PDF is a cross-check once a PDF parser can read it.
  - name: aeroplan-official-pdf
    url: https://www.aircanada.com/content/dam/aircanada/loyalty-content/documents/flight-rewards-chart-june2026-en.pdf
    format: pdf
    program: aeroplan
    provides: chart
    role: fallback   # highest trust, but visually-laid-out PDF; ATF HTML is the working primary
    trust: 0.95
    updated_at: "2026-06-01"
    layers: [charts]

  # Aeroplan: AwardTravelFinder HTML chart (server-rendered, no WAF, June 2026).
  # Table format: From | Distance | Economy | Premium | Business | First | Note
  - name: atf-aeroplan-chart
    url: https://awardtravelfinder.com/award-charts/aeroplan
    format: html_table_wide
    program: aeroplan
    provides: chart
    role: primary
    trust: 0.82
    updated_at: "2026-06-29"
    layers: [charts]

  # LifeMiles: AwardTravelFinder HTML chart (server-rendered, no WAF, June 2026).
  # Table format: From | To | Economy | Business | First | Note
  - name: atf-lifemiles-chart
    url: https://awardtravelfinder.com/award-charts/lifemiles
    format: html_table_wide
    program: lifemiles
    provides: chart
    role: primary
    trust: 0.80
    updated_at: "2026-06-29"
    layers: [charts]

  # Turkish Miles&Smiles: AwardTravelFinder "guide" page. This is a hub-based
  # per-destination table (destination | code | economy<tier> | business<tier> |
  # first<tier>) with origin IMPLICITLY the Turkish hub (IST) — NOT a from/to
  # wide chart. Parsed by the html_table_destination parser, which keys each row
  # on its exact IATA code so IST->LAX (100k biz) resolves distinctly from
  # IST->ORD (90k biz) rather than collapsing all of North America to one price.
  - name: atf-turkish-chart
    url: https://awardtravelfinder.com/turkish-miles-guides
    format: html_table_destination
    program: turkish
    hub: IST
    provides: chart
    role: primary
    trust: 0.80
    updated_at: "2026-06-29"
    layers: [charts]

  # ANA Mileage Club: AwardTravelFinder HTML chart (server-rendered, no WAF).
  # ANA publishes ROUND-TRIP charts; the wide parser + lookup normalize to
  # one-way and flag `rt_to_ow_normalized` (§6 carried-over fix).
  - name: atf-ana-chart
    url: https://awardtravelfinder.com/award-charts/ana
    format: html_table_wide
    program: ana
    provides: chart
    role: primary
    trust: 0.80
    updated_at: "2026-06-29"
    layers: [charts]

  # Singapore KrisFlyer: AwardTravelFinder "guide" page. Hub-based per-destination
  # table (destination | code | economy<saver> | business<saver> | first/suites),
  # origin IMPLICITLY the KrisFlyer hub (SIN). Parsed by html_table_destination;
  # keying on the exact code matters here too — SIN->LAX (112.5k biz) differs
  # from SIN->JFK (117k biz) within North America.
  - name: atf-krisflyer-chart
    url: https://awardtravelfinder.com/singapore-krisflyer-guides
    format: html_table_destination
    program: krisflyer
    hub: SIN
    provides: chart
    role: primary
    trust: 0.80
    updated_at: "2026-06-29"
    layers: [charts]

  # KrisFlyer official one-way Advantage/Saver chart PDF (direct CDN, not WAF-
  # protected). URL confirmed live 2026-07-01 (Content-Type: application/pdf),
  # effective 1 Nov 2025; independently re-confirmed live via web search
  # 2026-07-08 (same filename still indexed) — this is a real, current URL,
  # not a guess. Note: this is a ZONE x ZONE matrix (Zones 1-13, SQ own-metal),
  # not a from/to/distance grid — the current wide-table PDF selector will not
  # extract it, AND it shares the `program_zones.krisflyer` gap documented on

  # successful PDF parse wouldn't resolve to route quotes today). Kept as a
  # confirmed cross-check source pending both fixes; KrisFlyer route data is
  # served today by atf-krisflyer-chart (HTML). A SEPARATE official PDF
  # specifically for the Star Alliance partner chart also exists and is more
  # relevant to this project's Star Alliance routing thesis:

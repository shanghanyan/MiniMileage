  # EVA Air Infinity MileageLands — NEW 2026-07-08. EVA had a `capital_one`
  # ratio (see knowledge/ratios.yaml) but ZERO chart source before this: a
  # ratio with nothing to convert into was a dead end. This page's "Star
  # Alliance partner award" section is a named-region x named-region matrix

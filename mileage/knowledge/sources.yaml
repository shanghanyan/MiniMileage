  # East / North Africa / Central,South Africa), one table per cabin under an
  # exact "<Cabin> Class" <h3> — same shape `_is_zone_matrix_table` /
  # `_strict_cabin_heading` already parse for 10x-turkish-chart, just with
  # region names instead of "Zone N" numbers. `_matrix_zone_key` already falls
  # back to `canonicalize_region` for non-numeric headers, so this reuses
  # `format: html_table_zone_matrix` as-is — no new parser needed.
  # RE-VERIFIED 2026-07-08 (second pass): re-fetched the live page (still
  # serving identical content) and reconstructed a faithful HTML snippet of
  # its real "Economy Class" table (same headers/values observed on the live
  # page) and ran it through the ACTUAL `parse_chart_html_zone_matrix()` in
  # this repo (not hand-traced this time) — it parsed 36 real rows, confirming
  # the regions.py additions ("north africa"/"south west pacific"/"hawaii
  # central america"/"central south africa") do make every column resolve.
  # Still NOT a live network fetch of the real page through the real fetch
  # stack (this sandbox has no HTTP egress from its shell, only through the
  # web_fetch tool, which returns cleaned text, not raw HTML) — the open risk
  # is the real page's raw HTML structure (table nesting, extra markup)
  # differing from this reconstruction, not the region-mapping logic, which is
  # now proven. Trust bumped 0.45 -> 0.55 to reflect that; still run
  # `mileage sources --validate-urls --deep` for the final live confirmation.
  - name: 10x-eva-chart
    url: https://10xtravel.com/eva-air-infinity-mileagelands-award-charts/
    format: html_table_zone_matrix
    program: eva
    provides: chart

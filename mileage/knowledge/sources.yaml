  # 10xtravel blog fallbacks — single-program chart posts, server-rendered, no
  # WAF. Lower trust: blog mirrors, used only when the ATF pages above are
  # unavailable. Prose-heavy posts are the discovery agent's job.
  #
  # Both pages were redesigned (confirmed live 2026-07-06) away from the old
  # from/to/cabin wide table `html_table_wide` expects:
  #   - Turkish is now a region-NUMBER zone x zone matrix, one table per cabin
  #     (cabin named in a preceding heading) -> html_table_zone_matrix.
  #   - ANA is now a zone legend + many small round-trip season x cabin tables,
  #     one per zone pair (pair named in a preceding caption) ->
  #     html_table_seasonal_zones. Scope note: that parser only emits the
  #     ANA-OPERATED international zone-pair tables (the bulk of the page);
  #     the domestic distance-band tables and partner-operated departure
  #     tables use two further shapes, intentionally left for a follow-up.
  - name: 10x-turkish-chart
    url: https://10xtravel.com/turkish-airlines-award-charts/
    format: html_table_zone_matrix
    program: turkish
    provides: chart
    role: fallback
    trust: 0.55
    updated_at: "2026-07-06"

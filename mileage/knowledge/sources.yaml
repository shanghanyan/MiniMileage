  # KrisFlyer: 10xtravel "Star Alliance" partner-award matrix — NEW 2026-07-08.
  # A real, distinct numeric zone x zone matrix (Zone 1-12, headed literally
  # "Star Alliance Economy/Business/First Award Chart") separate from the
  # same page's Singapore-Airlines-own-metal Saver/Advantage charts (13 zones,
  # headed "Saver/Advantage <Cabin> Award Chart" — deliberately NOT matched,
  # out of scope). Required a small, targeted parser extension
  # (`_STAR_ALLIANCE_CABIN_HEADING_RE` in parse.py) since the heading shape
  # ("Star Alliance <Cabin> Award Chart") differs from the Turkish page's
  # ("<Cabin> Class"); reuses the existing numeric-zone-matrix path otherwise.
  # CAVEAT — will not resolve to route quotes yet: `charts.yaml::program_zones`
  # has no `krisflyer` airport->zone table (the existing krisflyer-official-pdf
  # below has the exact same gap). Building one means assigning each of the
  # ~80 airports in `charts.yaml::airports` to one of these 12 zones — left
  # undone here rather than guessed. The zone legend (from this same page) for
  # whoever does that next:
  #   1 SE Asia 1 (Brunei/Indonesia/Malaysia/Singapore) · 2 SE Asia 2 (Cambodia/
  #   Laos/Myanmar/Philippines/Thailand/Vietnam) · 3 N Asia 1 (HK/Macau/Taiwan) ·
  #   4 N Asia 2 (China/Guam/Japan/Micronesia/Palau/Russia Far East/S Korea) ·
  #   5 South West Pacific (Australia/NZ/Pacific islands) · 6 North America
  #   (Canada/USA ex-Hawaii) · 7 Hawaii+Central America/Caribbean · 8 South
  #   America · 9 Europe · 10 Middle East + North Africa · 11 Central/South
  #   Africa · 12 Central/South Asia (India/Pakistan/Bangladesh/...).
  # RE-VERIFIED 2026-07-08 (second pass): re-fetched the live page (still
  # serving identical content) and reconstructed a faithful HTML snippet with
  # BOTH a "Saver Economy Award Chart" (own-metal, should be skipped) and a
  # "Star Alliance Economy Award Chart" table (should parse), matching the
  # real headings/values observed live, then ran it through the ACTUAL
  # `parse_chart_html_zone_matrix()` in this repo. Result: exactly 0 rows from
  # the own-metal table and 12 real `krisflyer_zone_N` rows from the Star
  # Alliance table — proves `_STAR_ALLIANCE_CABIN_HEADING_RE` both matches
  # what it should and does NOT cross-contaminate from the similarly-shaped
  # own-metal table. The `program_zones.krisflyer` gap above is still real and
  # still unfixed (parsing works; airport->zone resolution doesn't yet).
  - name: 10x-krisflyer-chart

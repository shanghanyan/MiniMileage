  # (not added as its own target — same zone-matrix + program_zones gap as
  # above; the HTML equivalent of this same data is 10x-krisflyer-chart).
  # Requires pdfplumber for binary extraction; gracefully returns [] without it.
  - name: krisflyer-official-pdf
    url: https://www.singaporeair.com/content/dam/sia/web-assets/pdfs/ppsclub-krisflyer/krisflyer/progupdates/awardcharts/SingaporeAirlinesOne-WayAdvantageSaverAwardChartupdated1Nov25.pdf
    format: pdf

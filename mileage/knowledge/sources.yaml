# Aggregator (Engine A) target list — ordered, trust-weighted (§6).
#
# PHASE 1+: real public URLs for L4 chart data. Sources are sorted by the
# loader (highest trust first) but explicit ordering here states intent.
#
# BRAIN BOUNDARY: WAF-protected first-party sites (Turkish official,
# LifeMiles official, ANA official, KrisFlyer official) belong to Engine B.
# Do NOT add those here. See §8 quarantine constraints in Cursor-Mileage-Plan.md.
#
# Target schema:
#   name       unique source id (becomes provenance source_name)
#   url        file:// (relative to this dir) or http(s)://
#   format     html_table | html_table_wide | html_table_destination |
#              html_table_zone_matrix | html_table_seasonal_zones | json | rss | pdf
#   program    loyalty program this source covers (required for html_table_wide + pdf + destination)
#   hub        program origin airport, IATA (required for html_table_destination)
#   provides   chart  (L4 — no live seat -> no_live_space flag)
#              award  (L3 — live seat -> seats_available set)
#   role       primary  (the source we DEPEND ON for this program)
#              fallback (a redundant backup: mirror, unparseable PDF, blog echo)
#              -> the live-scrape scoreboard hard-fails only when a PRIMARY
#                 breaks; a fallback failure is a WARN (a working primary covers
#                 it). Defaults to primary when omitted.
#   trust      [0,1] weight for rotation order + cross-check median
#   updated_at ISO date the source data was last verified current
#   layers     informational tags

targets:

  # ── L4 CHARTS — live public URLs ───────────────────────────────────────────

  # Aeroplan official Air Canada PDF (distance-based, June 2026).
  # Requires pdfplumber for binary PDF extraction; gracefully returns []
  # without it. Tagged role:fallback — atf-aeroplan-chart (HTML) is the working
  # primary; this high-trust PDF is a cross-check once a PDF parser can read it.
  - name: aeroplan-official-pdf
    url: https://www.aircanada.com/content/dam/aircanada/loyalty-content/documents/flight-rewards-chart-june2026-en.pdf
    format: pdf
    program: aeroplan
    provides: chart
    role: fallback   # highest trust, but visually-laid-out PDF; ATF HTML is the working primary
    trust: 0.95
    updated_at: "2026-06-01"
    layers: [charts]

  # Aeroplan: AwardTravelFinder HTML chart (server-rendered, no WAF, June 2026).
  # Table format: From | Distance | Economy | Premium | Business | First | Note
  - name: atf-aeroplan-chart
    url: https://awardtravelfinder.com/award-charts/aeroplan
    format: html_table_wide
    program: aeroplan
    provides: chart
    role: primary
    trust: 0.82
    updated_at: "2026-06-29"
    layers: [charts]

  # LifeMiles: AwardTravelFinder HTML chart (server-rendered, no WAF, June 2026).
  # Table format: From | To | Economy | Business | First | Note
  - name: atf-lifemiles-chart
    url: https://awardtravelfinder.com/award-charts/lifemiles
    format: html_table_wide
    program: lifemiles
    provides: chart
    role: primary
    trust: 0.80
    updated_at: "2026-06-29"
    layers: [charts]

  # Turkish Miles&Smiles: AwardTravelFinder "guide" page. This is a hub-based
  # per-destination table (destination | code | economy<tier> | business<tier> |
  # first<tier>) with origin IMPLICITLY the Turkish hub (IST) — NOT a from/to
  # wide chart. Parsed by the html_table_destination parser, which keys each row
  # on its exact IATA code so IST->LAX (100k biz) resolves distinctly from
  # IST->ORD (90k biz) rather than collapsing all of North America to one price.
  - name: atf-turkish-chart
    url: https://awardtravelfinder.com/turkish-miles-guides
    format: html_table_destination
    program: turkish
    hub: IST
    provides: chart
    role: primary
    trust: 0.80
    updated_at: "2026-06-29"
    layers: [charts]

  # ANA Mileage Club: AwardTravelFinder HTML chart (server-rendered, no WAF).
  # ANA publishes ROUND-TRIP charts; the wide parser + lookup normalize to
  # one-way and flag `rt_to_ow_normalized` (§6 carried-over fix).
  - name: atf-ana-chart
    url: https://awardtravelfinder.com/award-charts/ana
    format: html_table_wide
    program: ana
    provides: chart
    role: primary
    trust: 0.80
    updated_at: "2026-06-29"
    layers: [charts]

  # Singapore KrisFlyer: AwardTravelFinder "guide" page. Hub-based per-destination
  # table (destination | code | economy<saver> | business<saver> | first/suites),
  # origin IMPLICITLY the KrisFlyer hub (SIN). Parsed by html_table_destination;
  # keying on the exact code matters here too — SIN->LAX (112.5k biz) differs
  # from SIN->JFK (117k biz) within North America.
  - name: atf-krisflyer-chart
    url: https://awardtravelfinder.com/singapore-krisflyer-guides
    format: html_table_destination
    program: krisflyer
    hub: SIN
    provides: chart
    role: primary
    trust: 0.80
    updated_at: "2026-06-29"
    layers: [charts]

  # KrisFlyer official one-way Advantage/Saver chart PDF (direct CDN, not WAF-
  # protected). URL confirmed live 2026-07-01 (Content-Type: application/pdf),
  # effective 1 Nov 2025. Note: this is a ZONE x ZONE matrix (Zones 1-13), not a
  # from/to/distance grid — the current wide-table PDF selector will not extract
  # it. Kept as a confirmed cross-check source pending a zone-matrix PDF parser;
  # KrisFlyer route data is served today by atf-krisflyer-chart (HTML).
  # Requires pdfplumber for binary extraction; gracefully returns [] without it.
  - name: krisflyer-official-pdf
    url: https://www.singaporeair.com/content/dam/sia/web-assets/pdfs/ppsclub-krisflyer/krisflyer/progupdates/awardcharts/SingaporeAirlinesOne-WayAdvantageSaverAwardChartupdated1Nov25.pdf
    format: pdf
    program: krisflyer
    provides: chart
    role: fallback   # confirmed live, but zone-matrix PDF the wide selector can't read; ATF guide is primary
    trust: 0.55
    updated_at: "2026-07-01"
    layers: [charts]

  # 10xtravel blog fallbacks — single-program chart posts, server-rendered, no
  # WAF. Lower trust: blog mirrors, used only when the ATF pages above are
  # unavailable. Prose-heavy posts are the discovery agent's job.
  #
  # Both pages were redesigned (confirmed live 2026-07-06) away from the old
  # from/to/cabin wide table `html_table_wide` expects:
  #   - Turkish is now a region-NUMBER zone x zone matrix, one table per cabin
  #     (cabin named in a preceding heading) -> html_table_zone_matrix.
  #   - ANA is now a zone legend + many small round-trip season x cabin tables,
  #     one per zone pair (pair named in a preceding caption) ->
  #     html_table_seasonal_zones. Scope note: that parser only emits the
  #     ANA-OPERATED international zone-pair tables (the bulk of the page);
  #     the domestic distance-band tables and partner-operated departure
  #     tables use two further shapes, intentionally left for a follow-up.
  - name: 10x-turkish-chart
    url: https://10xtravel.com/turkish-airlines-award-charts/
    format: html_table_zone_matrix
    program: turkish
    provides: chart
    role: fallback
    trust: 0.55
    updated_at: "2026-07-06"
    layers: [charts]

  - name: 10x-ana-chart
    url: https://10xtravel.com/ana-mileage-club-award-charts/
    format: html_table_seasonal_zones
    program: ana
    provides: chart
    role: fallback
    trust: 0.55
    updated_at: "2026-07-06"
    layers: [charts]

  # LifeMiles third-party PDF (thriftytraveler.com, zone matrix, 2022).
  # Requires pdfplumber; gracefully returns []. Trust low — outdated + third-party.
  # Useful only as a cross-check when ATF HTML is unavailable.
  - name: lifemiles-chart-pdf
    url: https://thriftytraveler.com/wp-content/uploads/2022/06/Avianca-Redemption-Table.pdf
    format: pdf
    program: lifemiles
    provides: chart
    role: fallback
    trust: 0.40
    updated_at: "2022-06-01"
    layers: [charts]

  # ── L3 LIVE AWARD SPACE ────────────────────────────────────────────────────
  #
  # Candidate public L3 sources evaluated (NOT added — see notes):
  #   - roame.travel/search + /skyview : lighter than airline sites, but no
  #       documented JSON endpoint; test with curl_cffi before adding. If it ever
  #       needs sensor data it becomes the Brain's problem (§8), not a target here.
  #   - awardfares.com : publishes live availability but full data is account-
  #       gated -> credentialed scraping is OUT (§8 boundary). Not a target.
  #   - seats.aero Partner API : cleanest L3 path, wired as an OPTIONAL paid
  #       provider (SeatsAeroProvider), off by default — not an aggregator target.

  # Placeholder fixture — stands in for a live seats.aero partner API call.
  # Real replacement: configure SEATS_AERO_KEY and wire SeatAeroProvider (§7).
  # Turkish/Aeroplan/LifeMiles live space flows through here in demo mode.
  - name: starnet-award-space
    url: file://fixtures/starnet_award_space.json
    format: json
    provides: award
    role: primary   # sole L3 live-award source (placeholder for the seats.aero call)
    trust: 0.30
    updated_at: "2026-06-24"
    layers: [award]

  # ── OFFLINE / TEST FIXTURES ────────────────────────────────────────────────

  # Legacy long-format HTML fixture (program/from/to/cabin/miles columns).
  # Kept for offline CI and backward-compat; real data comes from ATF above.
  - name: awardatlas-charts
    url: file://fixtures/awardatlas_charts.html
    format: html_table
    provides: chart
    role: fallback   # legacy offline fixture; real chart data comes from the ATF sources
    trust: 0.20
    updated_at: "2026-06-18"
    layers: [charts]

  - name: milefeed-rss
    url: file://fixtures/milefeed.rss
    format: rss
    provides: award
    role: fallback   # offline RSS fixture; live award space flows through starnet-award-space
    trust: 0.15
    layers: [award]

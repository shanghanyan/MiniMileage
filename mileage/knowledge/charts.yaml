# Partner award charts (Layer 4), one-way miles unless `roundtrip: true`.
# Seeded curated values for the Phase 0 vertical slice. Refreshed by the
# aggregator (Engine A) in Phase 1; these are the trusted-curated baseline.
#
# All chart-derived quotes are flagged `no_live_space` by the curated provider:
# they prove a seat *can* cost this many miles, not that one is bookable today.

# Airport -> canonical region token. Expanded beyond the Phase 0 twelve to a
# realistic award-relevant set across NA / Europe / North Asia / SE Asia / South
# Asia / Middle East / Oceania / South America / Africa. These are factual IATA
# classifications (no invented geography); used by lookup to map a route's
# airports to the canonical region pair a chart band is keyed on.

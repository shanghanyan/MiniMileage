      # Qantas' own 3-partner list — Amex/Capital One/Citi only).
      flying_blue: 1.0
      virgin_atlantic: 1.0
      avios: 1.0
      cathay_pacific: 1.0
      emirates: 1.0       # Bilt is Emirates' only remaining 1:1 partner per its own page

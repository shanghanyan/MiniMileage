      flying_blue: 1.0
      virgin_atlantic: 1.0
      avios: 1.0
      cathay_pacific: 1.0
      emirates: 0.8       # confirmed 5:4 on Emirates' own ATF chart page
      etihad: 1.0
      qantas: 1.0

  - from_currency: bilt
    source: "Bilt Rewards — official transfer partners list"
    url: https://support.biltrewards.com/hc/en-us/articles/19086448638989-Bilt-s-Transfer-Partners
    trust: 0.9
    updated_at: "2026-06-22"
    partners:
      lifemiles: 1.0    # Avianca LifeMiles
      turkish: 1.0      # Turkish Airlines Miles&Smiles
      aeroplan: 1.0     # Air Canada Aeroplan
      # NOT partners (confirmed absent from Bilt's official 19-airline list):
      # krisflyer, ana, eva.
      # --- Tier 2 expansion (2026-07-20), each ratio read off the program's

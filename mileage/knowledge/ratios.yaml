updated_at: "2026-06-01"
partners:
  aeroplan: 1.0       # Air Canada Aeroplan (Star Alliance)
  turkish: 1.0        # Turkish Miles&Smiles (Star Alliance)
  lifemiles: 1.0      # Avianca LifeMiles (Star Alliance)
  krisflyer: 1.0      # Singapore KrisFlyer (Star Alliance)
  eva: 1.0            # EVA Air Infinity MileageLands (Star Alliance)
  # united: intentionally absent — see note above.

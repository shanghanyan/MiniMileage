[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mileage"
version = "0.0.0"
description = "A points-to-flights optimizer. Phase 5: multi-user Capital One vertical slice with CLI, FastAPI, React UI, a Redis-backed shared memory layer, and Arize AX tracing + golden-route CI evals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "networkx>=3.0,<4.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-dotenv>=1.0,<2.0",
]

# Optional aggregator (Engine A) accelerators. The scraper runs with the stdlib
# + httpx alone; these only widen what it can fetch/parse. Absence degrades
# gracefully (curl_cffi -> impersonation off; feedparser/pdfplumber -> skipped).
[project.optional-dependencies]
aggregator = [
    "curl_cffi>=0.7",
    "feedparser>=6.0",
    "pdfplumber>=0.11",
    # Content-coding decoders. Many chart hosts (e.g. AwardTravelFinder) reply
    # with `content-encoding: br`/`zstd`; without these httpx hands back the
    # raw compressed bytes as `.text`, which looks like a 200 with no <table>.
    # The Fetcher only advertises an encoding it can decode (see fetch.py:
    # _accept_encoding), so absence degrades to gzip rather than silent garbage.
    "brotli>=1.1",
    "zstandard>=0.22",
    # Only needed if you OPT IN to fetching through a SOCKS proxy
    # (Fetcher(trust_env=True) / MILEAGE_TRUST_ENV=1). By default the Fetcher
    # ignores ALL_PROXY, so the scraper never silently crashes on a missing
    # socksio when a stray socks5h:// proxy is exported into the environment.
    "socksio>=1.0",
]

# Discovery intake (§6.1, aggregator mode b): blog + transcript readers. All
# optional — without them, blog bodies fall back to a stdlib HTML stripper and
# transcripts to yt-dlp/skip, so discovery still runs (email path needs none of
# these — it's stdlib imaplib + the keyless deterministic extractor).
discovery = [
    "feedparser>=6.0",
    "trafilatura>=1.6",
    "readability-lxml>=0.8",
    "youtube-transcript-api>=0.6",
    "yt-dlp>=2024.0",
]

# Dev / test tooling. The suite also runs as standalone scripts
# (`python3 tests/test_phaseN.py`), but pytest collects the same `test_*`
# functions: `pip install -e ".[dev]" && pytest`.
dev = [
    "pytest>=8.0",
]

# Phase 4 multi-user backend. Without it, MILEAGE_REDIS_URL gracefully falls
# back to the in-process stores, so single-user/local runs need nothing extra.
multiuser = [
    "redis>=5.0",
    "certifi>=2024.0",  # CA bundle for Upstash rediss:// TLS on macOS Python
]

# Arize AX tracing (§10). Without it, tracing is a no-op and the app runs
# unchanged; install to emit OpenInference spans for each redemption run.
observability = [
    "arize-otel>=0.7",
    "openinference-semantic-conventions>=0.1",
]

[project.scripts]
mileage = "mileage.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# tests/conftest.py pins MILEAGE_OFFLINE=1 so the suite stays hermetic.

[tool.setuptools]
packages = [
    "mileage",
    "mileage.api",
    "mileage.domain",
    "mileage.providers",
    "mileage.providers.aggregator",
    "mileage.providers.aggregator.ingest",
    "mileage.providers.aggregator.extract",
    "mileage.providers.brain",
    "mileage.verify",
    "mileage.graph",
    "mileage.store",
]

[tool.setuptools.package-data]
mileage = ["knowledge/*.yaml", "knowledge/fixtures/*"]

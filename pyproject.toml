[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mileage"
version = "0.0.0"
description = "A points-to-flights optimizer. Phase 3: Capital One vertical slice with CLI, FastAPI, and React UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "networkx>=3.0,<4.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
]

# Optional aggregator (Engine A) accelerators. The scraper runs with the stdlib
# + httpx alone; these only widen what it can fetch/parse. Absence degrades
# gracefully (curl_cffi -> impersonation off; feedparser/pdfplumber -> skipped).
[project.optional-dependencies]
aggregator = [
    "curl_cffi>=0.7",
    "feedparser>=6.0",
    "pdfplumber>=0.11",
]

[project.scripts]
mileage = "mileage.cli:main"

[tool.setuptools]
packages = [
    "mileage",
    "mileage.api",
    "mileage.domain",
    "mileage.providers",
    "mileage.providers.aggregator",
    "mileage.providers.brain",
    "mileage.verify",
    "mileage.graph",
    "mileage.store",
]

[tool.setuptools.package-data]
mileage = ["knowledge/*.yaml", "knowledge/fixtures/*"]
